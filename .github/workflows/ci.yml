name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            testing/package-lock.json
            landing/package-lock.json
            video/package-lock.json
            poster/package-lock.json
            booklet/package-lock.json

      # npm ci, not npm install. This step read `npm install` with a comment
      # saying npm ci could not run anywhere because the lockfiles were out of
      # sync -- `Missing: source-map@0.6.1 from lock file`, the error that
      # failed the 2026-07-24 production deploy. That was true of the tree it
      # was written against. It is not true of this one: `npm ci` was run in
      # all eight workspaces on linux under both node 22 / npm 10 (what
      # .node-version pins, and what this job uses) and node 24 / npm 11, and
      # every one of them installed clean. The workaround was costing
      # reproducibility for nothing -- two installs on different days could
      # resolve differently, which is the single property npm ci exists to
      # guarantee -- so it goes, and vercel.json goes with it.
      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      # The landing workspace is what Vercel builds and serves at
      # agentic-automl-platform.vercel.app, and until now this job never
      # installed it, never built it and never ran its suite -- it appeared in
      # `cache-dependency-path` and nowhere else. So `landing/src/tests/
      # preview-components.test.tsx`, whose entire job is to assert the exact
      # installCommand in vercel.json so it cannot silently revert, has never
      # executed on any CI run. A guard that never runs is not a guard.
      - name: Install landing dependencies
        run: npm --prefix landing ci --no-audit --no-fund

      - name: Lint core app
        run: npm run lint

      - name: Test core app
        run: npm run test

      - name: Build core app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      # Build before test, and not for tidiness: twelve of the landing suite's
      # ninety-five tests are marked "(post-build)" and read landing/dist. Run
      # them without a build and they fail on a missing directory, which is how
      # this ordering was established rather than assumed.
      - name: Build landing
        run: npm run build:landing

      - name: Test landing
        run: npm run test:landing
