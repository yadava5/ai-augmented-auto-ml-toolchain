name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Superseding a PR's own older run is the point of cancel-in-progress: only
# the tip of a branch under review is interesting. Superseding a run on `main`
# is not, and it happened four times in twenty minutes on 2026-08-14 while a
# short queue of PRs was merged:
#
#   e3d98e2e  cancelled     89ba59a5  cancelled
#   3c772e98  cancelled     ee4d49b3  cancelled
#
# Four commits went onto the default branch with no completed CI run behind
# them, and nothing anywhere says so — a cancelled run is not a red run, so
# the branch reads as "no failures" while four of its commits were never
# actually validated. That is the shape of a check that cannot fail: it did
# not report a wrong answer, it reported none, and the absence looks like
# consent.
#
# Grouping is unchanged; only the cancellation is now scoped to pull requests.
# The cost is that a burst of merges queues a few runs instead of collapsing
# them, which is exactly the cost worth paying on the branch that ships.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Deliberately a separate job with no `npm ci`. The checker is dependency-free
  # -- node builtins plus `git ls-files` and `git grep` -- so it can report in
  # well under a minute instead of queueing behind three installs, a build and
  # two suites. A check that is slow becomes a check somebody makes optional,
  # and an optional check is how a number goes stale in the first place. It also
  # means a PR that only edits README.md still gets a verdict.
  readme-facts:
    name: README numbers agree with the code
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A real checkout, not an archive: the script reads the tree through
      # `git ls-files` and `git grep`, so it needs the repository, not the files.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # setup-node with no cache and no install. The script needs no packages,
      # but it should run on the node this repo pins rather than on whatever the
      # runner image happens to ship this month -- the gate reporting a
      # different answer from `npm run readme:check` on a developer's machine
      # would be the one failure mode nobody would think to look for.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # The same command the README documents, so CI and the reader cannot
      # diverge. A zero-match claim site is a failure here, not a skip.
      - name: Check every number the README asserts
        run: npm run readme:check

  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            testing/package-lock.json
            landing/package-lock.json
            video/package-lock.json
            poster/package-lock.json
            booklet/package-lock.json

      # Deliberately before the installs: this needs no dependencies at all
      # (node fs + crypto), so it fails fast and costs nothing. It goes red
      # when landing/public/system-card/ -- a build output committed so that no
      # deploy can drop the page -- no longer matches the booklet sources it
      # was built from, which is otherwise invisible to lint, test and build.
      - name: Check committed system card is current
        run: npm run check:system-card

      # npm ci, not npm install. This step read `npm install` with a comment
      # saying npm ci could not run anywhere because the lockfiles were out of
      # sync -- `Missing: source-map@0.6.1 from lock file`, the error that
      # failed the 2026-07-24 production deploy. That was true of the tree it
      # was written against. It is not true of this one: `npm ci` was run in
      # all eight workspaces on linux under both node 22 / npm 10 (what
      # .node-version pins, and what this job uses) and node 24 / npm 11, and
      # every one of them installed clean. The workaround was costing
      # reproducibility for nothing -- two installs on different days could
      # resolve differently, which is the single property npm ci exists to
      # guarantee -- so it goes, and vercel.json goes with it.
      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      # The landing workspace is what Vercel builds and serves at
      # agentic-automl-platform.vercel.app, and until now this job never
      # installed it, never built it and never ran its suite -- it appeared in
      # `cache-dependency-path` and nowhere else. So `landing/src/tests/
      # preview-components.test.tsx`, whose entire job is to assert the exact
      # installCommand in vercel.json so it cannot silently revert, has never
      # executed on any CI run. A guard that never runs is not a guard.
      - name: Install landing dependencies
        run: npm --prefix landing ci --no-audit --no-fund

      - name: Lint core app
        run: npm run lint

      - name: Test core app
        run: npm run test

      - name: Build core app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      # Build before test, and not for tidiness: twelve of the landing suite's
      # ninety-five tests are marked "(post-build)" and read landing/dist. Run
      # them without a build and they fail on a missing directory, which is how
      # this ordering was established rather than assumed.
      - name: Build landing
        run: npm run build:landing

      - name: Test landing
        run: npm run test:landing
