name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deliberately a separate job with no `npm ci`. The checker is dependency-free
  # so it can report in well under a minute instead of queueing behind three
  # installs — a check that is slow becomes a check that gets made optional, and
  # an optional check is how a number goes stale in the first place. It also
  # means a PR that only edits README.md still gets a verdict.
  readme-facts:
    name: README numbers agree with the code
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No setup-node, no install: the script is Node builtins only, and the
      # runner already ships a Node new enough for ESM. It reads the tree with
      # `git ls-files`, which is why this needs a real checkout rather than an
      # archive.
      - name: Check every number the README asserts
        run: node scripts/readme-facts.mjs --check

  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            testing/package-lock.json
            landing/package-lock.json
            video/package-lock.json
            poster/package-lock.json
            booklet/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Lint core app
        run: npm run lint

      - name: Test core app
        run: npm run test

      - name: Build core app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
